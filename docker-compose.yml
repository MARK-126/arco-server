services:
  arco-app:
    build: ../arco
    ports:
      - '3000:3000'
    restart: unless-stopped
    depends_on:
      - api-server

  api-server:
    build: .
    ports:
      - '5001:5001'
    restart: unless-stopped
    depends_on:
      - posta-db
    environment:
      - NODE_ENV=development
      - DB_HOST=posta-db
      - DB_PORT=3306
      - DB_USER=posta-db-username
      - DB_PASSWORD=posta-db-password
      - DB_NAME=posta-db

  posta-db:
    image: mysql:8.4
    platform: linux/amd64
    restart: always
    ports:
      - '3307:3306'
    environment:
      MYSQL_DATABASE: posta-db
      MYSQL_USER: posta-db-username
      MYSQL_PASSWORD: posta-db-password
      MYSQL_ROOT_PASSWORD: posta-db-password
    volumes:
      - ../.docker/mysql/data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
